# Profile cleanup: no watercolor copy, "stickers" in the note, an "App version" row at the
# bottom, and the Friends empty-state CTA. Never taps Log Out's confirm or any delete action.
appId: com.iancheung228.lingostickers
---
- launchApp:
    clearState: true
- openLink: "exp+lingostickers-mobile://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 60000

- tapOn: "Email"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn: "WELCOME BACK"   # dismisses the keyboard
- tapOn: "Sign In"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "FOUND"
    timeout: 30000

# Open My Profile through the settings chip in the top row (its accessibility label).
- tapOn:
    text: "Open your profile and settings"
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 15000
- assertNotVisible: ".*watercolor.*"
- assertVisible: ".*sticker.*"
- takeScreenshot: 01-profile-top

# The version row sits at the very bottom of the scroll view.
- scrollUntilVisible:
    element:
      id: "profile-version"
    direction: DOWN
    timeout: 30000
    speed: 40
- assertVisible:
    id: "profile-version"
- assertVisible: "Log Out"
- takeScreenshot: 02-profile-bottom

# Friends tab: the empty state, if the QA account has no friends.
# Profile is a pushed screen without the tab bar: leave it first.
- tapOn:
    text: "Go back"
- extendedWaitUntil:
    visible: "FOUND"
    timeout: 15000
- tapOn: "Friends.*"
- extendedWaitUntil:
    visible: ".*(Find a friend|Learn alongside someone|Friends).*"
    timeout: 15000
- runFlow:
    when:
      visible: "Find a friend"
    commands:
      - assertVisible: "Find a friend"
      - takeScreenshot: 03-friends-empty-cta
- runFlow:
    when:
      notVisible: "Find a friend"
    commands:
      - takeScreenshot: 03-friends-not-empty-no-cta
