# Profile cleanup: no watercolor copy, "stickers" in the note, an "App version" row at the
# bottom. Never taps Log Out's confirm or any delete action.
appId: com.iancheung228.lingostickers
---
- launchApp:
    clearState: true
- openLink: "exp+lingostickers-mobile://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 60000

- tapOn: "Email"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn: "WELCOME BACK"   # dismisses the keyboard
- tapOn: "Sign In"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "FOUND"
    timeout: 30000

# Open My Profile through the settings chip in the top row (its accessibility label).
- tapOn:
    text: "Open your profile and settings"
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 15000
- assertNotVisible: ".*watercolor.*"
- assertVisible: ".*sticker.*"
- takeScreenshot: 01-profile-top

# The version row sits at the very bottom of the scroll view.
- scrollUntilVisible:
    element:
      id: "profile-version"
    direction: DOWN
    timeout: 30000
    speed: 40
- assertVisible:
    id: "profile-version"
- assertVisible: "Log Out"
- takeScreenshot: 02-profile-bottom

# Friends is switched off for v1 (lib/features.ts SOCIAL_ENABLED), so the
# Friends empty state is no longer reachable; hide-social-v1.yaml covers the
# tab being gone. Leave Profile and confirm the home screen is back.
- tapOn:
    text: "Go back"
- extendedWaitUntil:
    visible: "FOUND"
    timeout: 15000
