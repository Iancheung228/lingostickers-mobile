# Dark-mode QA helper: dev client -> Metro -> sign in (does NOT reseed any account).
# Run: maestro --device <udid> test -e MAESTRO_EMAIL=.. -e MAESTRO_PASSWORD=.. -e METRO_PORT=8084 -e PREFIX=base <flow>
appId: com.iancheung228.lingostickers.dev
---
- launchApp:
    clearState: true
- openLink: "lingostickers-dev://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 90000
- takeScreenshot: ${PREFIX}-01-sign-in
- tapOn: "Email"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn: "WELCOME BACK"
- tapOn: "Sign In"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Your words.*"
    timeout: 40000
- takeScreenshot: ${PREFIX}-02-home
