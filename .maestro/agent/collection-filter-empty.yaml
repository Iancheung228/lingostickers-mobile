# Collection favourites filter with zero matches: the hero, Latest finds and Latest
# stickers blocks are hidden and the grid shows "No favourites yet". Toggling the
# heart back to All restores the blocks and the pomme card.
appId: com.iancheung228.lingostickers
---
- runFlow: ../sign-in.yaml

- tapOn: "Collection"
- extendedWaitUntil:
    visible: "Latest stickers.*"
    timeout: 20000
- takeScreenshot: 01-collection-all

# Heart icon turns the grid into favourites only.
- tapOn:
    text: "Show favourites only"
- extendedWaitUntil:
    visible: "No favourites yet.*"
    timeout: 10000
- assertNotVisible: ".*No stickers yet.*"
- assertNotVisible: ".*Latest stickers.*"
- assertNotVisible: ".*Latest finds.*"
- takeScreenshot: 02-favourites-empty

# Heart again (now labelled "Showing favourites only...") goes back to All.
- extendedWaitUntil:
    visible: "Showing favourites only.*"
    timeout: 10000
- tapOn:
    text: "Showing favourites only.*"
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: "Latest stickers.*"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*pomme.*"
    timeout: 10000
- assertNotVisible: "No favourites yet.*"
- takeScreenshot: 03-favourites-cleared
