# Collection favourites filter with zero matches: the filter sheet's "Favourites only"
# turns the grid into "No favourites yet" (seeded cards have no heart), and the wall and
# toolbar stay. Switching it off brings the pomme card back.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml

- tapOn: "Collection.*"
- extendedWaitUntil:
    visible: "Your words.*"
    timeout: 20000
- takeScreenshot: 01-collection-all

- tapOn:
    id: "home-filter"
- extendedWaitUntil:
    visible: "Sort and filter"
    timeout: 10000
- tapOn:
    id: "home-filter-fav"
- tapOn:
    id: "home-filter-done"
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible: "No favourites yet.*"
    timeout: 10000
- assertNotVisible: ".*No stickers yet.*"
- assertVisible: "Your words.*"
- takeScreenshot: 02-favourites-empty

# "Show all" in the empty state clears the filter.
- tapOn: "Show all"
- extendedWaitUntil:
    visible: ".*pomme.*"
    timeout: 10000
- assertNotVisible: "No favourites yet.*"
- takeScreenshot: 03-favourites-cleared
