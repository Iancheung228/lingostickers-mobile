# UX baseline tour, card detail for 'pomme': front, back, and both edit sheets
# (word and meaning) opened, then cancelled. Cancel leaves the card unchanged.
# No AI calls.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml
- tapOn: "Collection"
- extendedWaitUntil:
    visible: "Your words.*"
    timeout: 20000
- tapOn: "pomme, apple.*"
- extendedWaitUntil:
    visible:
      id: "card-flip"
    timeout: 15000
- tapOn:
    id: "card-flip"
- extendedWaitUntil:
    visible: "Meaning, .*Edit"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: 03a-card-detail

# Word edit sheet (pencil on the word side).
- tapOn: "Word, .*Edit"
- extendedWaitUntil:
    visible: "The word.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: 03c-edit-word-sheet
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 1000

# Meaning edit sheet.
- tapOn: "Meaning, .*Edit"
- extendedWaitUntil:
    visible: "What it means.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: 03d-edit-meaning-sheet
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 1000
