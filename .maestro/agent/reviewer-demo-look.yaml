# App Review demo account, LOOK ONLY. Signs in with the demo credentials
# (passed in as MAESTRO_EMAIL / MAESTRO_PASSWORD by the caller, from
# .maestro/demo.env, NOT .maestro/qa.env), shows Home and Collection, then
# signs out. Never grades, edits, scans, or deletes anything here: the demo
# cards must stay due for App Review.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml

# Home: the due count is visible; do NOT tap "Start reviewing".
- extendedWaitUntil:
    visible: ".*due.*"
    timeout: 20000
- takeScreenshot: 01-demo-home

# Collection: real-photo cards.
- tapOn:
    text: "Collection"
- extendedWaitUntil:
    visible: "Collection"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-demo-collection

# Sign out (Profile > Log Out > confirm). Look-only flow: no other action.
- tapOn: "Open your profile and settings"
- extendedWaitUntil:
    visible: "My Profile"
    timeout: 15000
- scrollUntilVisible:
    element: "Log Out"
    direction: DOWN
    timeout: 30000
- tapOn: "Log Out"
- extendedWaitUntil:
    visible: "Are you sure you want to log out.*"
    timeout: 10000
- tapOn:
    text: "Log Out"
    index: 1
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 20000
- takeScreenshot: 03-demo-signed-out
