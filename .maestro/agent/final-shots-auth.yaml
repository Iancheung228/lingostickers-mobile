# Final fix pass: re-shoots sign-in with a wrong password, sign-up and onboarding 1 and 3.
# Never submits a sign-up. The onboarding screens open by deep link.
appId: ${APP_ID}
---
- launchApp:
    clearState: true
- openLink: "exp+lingostickers-mobile://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Email"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Password"
- inputText: "definitely-wrong-password"
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: ".*That email and password don't match.*"
    timeout: 20000
- tapOn:
    text: "Not Now"
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
# The Simulator does not paint masked dots for ANY secure field (also while typing), so the
# shot reveals the password with the eye to prove the value was kept.
- tapOn: "Show password"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: research_notes/ux-redesign-2026-11/final/21-sign-in-wrong-password
- tapOn: ".*Sign Up.*"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Create your collection"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: research_notes/ux-redesign-2026-11/final/22-sign-up
