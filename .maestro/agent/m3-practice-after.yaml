# M3 check 4, part C: reopen the orange card after practice and open Details.
# Caller compares the labels with part A. Demo account, staging.
appId: ${APP_ID}   # set by the caller: the installed dev build
---
- runFlow: ../sign-in.yaml
- extendedWaitUntil:
    visible: "Collection"
    timeout: 20000
- tapOn: "orange — orange.*"
- extendedWaitUntil:
    visible:
      id: "card-flip"
    timeout: 15000
- tapOn:
    id: "card-flip"
- extendedWaitUntil:
    visible: "Meaning, .*Edit"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: "card-details"
- extendedWaitUntil:
    visible: "Interval, .*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: m3-04e-details-after
