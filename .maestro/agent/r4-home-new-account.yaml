# DO NOT RUN: this flow needs a QA account with ZERO cards (the shared QA account has
# cards, so it would fail at "Nothing stuck yet"). Kept for when a zero-card account exists.
# R4: a new account's Home. Needs the QA account with zero cards (the usual seed has one):
# the wall shows "Nothing stuck yet" and "Take a photo", with no toolbar, grid or Arrange chip.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
# An account with zero cards and no onboarding flag lands on onboarding first (R6b), so this
# flow signs in itself instead of reusing sign-in.yaml (which waits for "Collection"), then skips.
- launchApp:
    clearState: true
- openLink: "exp+lingostickers-mobile://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 60000
- tapOn: "Email"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Email"
- inputText: ${MAESTRO_EMAIL}
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Password"
- inputText: ${MAESTRO_PASSWORD}
- tapOn: "WELCOME BACK"
- tapOn: "Sign In"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Photograph something near you"
    timeout: 30000
- takeScreenshot: onboarding-first-run
- tapOn: "Skip"
- extendedWaitUntil:
    visible: "Nothing stuck yet"
    timeout: 20000
- assertVisible: "Take a photo"
- assertNotVisible: "Your words.*"
- assertNotVisible: "Start reviewing.*"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: r4-home-new
