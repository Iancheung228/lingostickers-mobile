# Username format on sign-up: an invalid username ("a b!tabc": space and "!") shows the
# rule line from lib/username.ts in the hint slot, never "Username available".
# Create Account stays disabled, so the button is never tapped: no real sign-up is submitted.
appId: com.iancheung228.lingostickers
---
- launchApp:
    clearState: true
- openLink: "exp+lingostickers-mobile://expo-development-client/?url=http%3A%2F%2Flocalhost%3A${METRO_PORT}"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 60000

# Sign-in footer link: "Don't have an account?  Sign Up".
- tapOn: ".*Sign Up.*"
- extendedWaitUntil:
    visible: "Create your collection"
    timeout: 15000
- tapOn:
    text: "Not Now"
    optional: true

# Type an invalid username. Tap, settle, tap again (keyboard slide-in can eat the first tap).
- tapOn: "Username"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Username"
- inputText: "a b!tabc"
- tapOn: "Create your collection"   # non-interactive label: dismisses the keyboard

- extendedWaitUntil:
    visible: "Use 3–20 letters, numbers, _ or \\."
    timeout: 10000
- assertNotVisible: ".*Username available.*"
- assertNotVisible: ".*Username taken.*"
- assertVisible: "Create Account"
- takeScreenshot: 01-username-rule-hint
