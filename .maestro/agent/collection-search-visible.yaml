# Collection search: the toolbar's magnifier opens an inline search field with Cancel;
# results appear while the keyboard stays up; Cancel puts the toolbar back.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml

- tapOn: "Collection.*"
- extendedWaitUntil:
    visible: "Search your collection"
    timeout: 20000
- tapOn: "Search your collection"
- extendedWaitUntil:
    visible:
      id: "collection-search-input"
    timeout: 10000

# Type without dismissing the keyboard: the field is focused on open.
- inputText: "pom"
- extendedWaitUntil:
    visible: ".*pomme.*"
    timeout: 10000
- assertVisible:
    id: "collection-search-cancel"
- takeScreenshot: 01-search-keyboard-up

# No match: the empty state names the query and offers to clear it.
- inputText: "zzz"
- extendedWaitUntil:
    visible: "No stickers match.*"
    timeout: 10000
- assertVisible: "Clear search"
- takeScreenshot: 02-search-no-match

# Cancel restores the toolbar and removes the search field.
- tapOn:
    id: "collection-search-cancel"
- assertNotVisible:
    id: "collection-search-input"
- extendedWaitUntil:
    visible: "Your words.*"
    timeout: 10000
- takeScreenshot: 03-search-cancelled
