appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
# Scenario 1, stage C: from the sentence alert, "Edit sentence" opens In use.
- tapOn: "Edit sentence"
- extendedWaitUntil:
    visible: "In use.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: s1-05-in-use-sheet
