# R5: Type a word on staging now SUCCEEDS, so this flow asserts the success path: the
# lookup returns a card preview and the button becomes "Add card". It does not add it.
# NOTE: the failed-lookup state (inline error, Try again, typed text kept) needs a FORCED
# FAILURE (key removed on the backend, or the network off); it cannot be triggered here.
# Spends ONE create-card call.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml
- tapOn: "Scan a new sticker"
- tapOn:
    text: "Agree and start scanning"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scan-type-word"
    timeout: 15000
- tapOn:
    id: "scan-type-word"
- extendedWaitUntil:
    visible:
      id: "type-word-input"
    timeout: 15000
- inputText: "chat"
- tapOn:
    id: "type-word-lookup"
- extendedWaitUntil:
    visible:
      id: "type-word-preview"
    timeout: 90000
- assertVisible: "Add card"
- assertNotVisible: "Try again"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: r5-type-word-result
