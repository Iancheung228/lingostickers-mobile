# R5: a failed lookup in Type a word shows an inline error with Try again and keeps
# the typed text. Spends ONE create-card call (staging has no GEMINI_API_KEY, so it fails).
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml
- tapOn: "Scan a new sticker"
- tapOn:
    text: "Agree and start scanning"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scan-type-word"
    timeout: 15000
- tapOn:
    id: "scan-type-word"
- extendedWaitUntil:
    visible:
      id: "type-word-input"
    timeout: 15000
- inputText: "chat"
- tapOn:
    id: "type-word-lookup"
- extendedWaitUntil:
    visible: "Try again"
    timeout: 90000
- assertVisible: "chat"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: r5-type-word-error
