# UX baseline tour, DARK MODE pass part 2: study front and back (no grading).
# Run only after the Simulator is switched to dark. No AI calls.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml
- extendedWaitUntil:
    visible: "Start reviewing — 1 card due.*"
    timeout: 20000
- tapOn: "Start reviewing — 1 card due.*"
- extendedWaitUntil:
    visible: "Tap to reveal.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: 09d-dark-study-front
- tapOn: "What did you call this\\?"
- extendedWaitUntil:
    visible: "Good — next review in.*"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: 09e-dark-study-back
