# Collection sort and filter: the toolbar's filter button (testID home-filter) opens a
# "Sort and filter" sheet with four sorts (Newest checked) and the Show toggles. Picking
# "A to Z" changes the sort; after Done the button reads "Sort and filter, on".
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml

- tapOn: "Collection.*"
- extendedWaitUntil:
    visible: "Your words.*"
    timeout: 20000
- takeScreenshot: 01-collection-default-sort

- tapOn:
    id: "home-filter"
- extendedWaitUntil:
    visible: "Sort and filter"
    timeout: 10000
- assertVisible:
    id: "collection-sort-newest"
- assertVisible:
    id: "collection-sort-oldest"
- assertVisible:
    id: "collection-sort-due"
- assertVisible:
    id: "collection-sort-az"
- assertVisible: "Favourites only"
- assertVisible: "Due only"
- takeScreenshot: 02-sort-sheet-open

- tapOn:
    id: "collection-sort-az"
- tapOn:
    id: "home-filter-done"
- extendedWaitUntil:
    notVisible: "Sort and filter"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: "Sort and filter, on"
- takeScreenshot: 03-sort-az
