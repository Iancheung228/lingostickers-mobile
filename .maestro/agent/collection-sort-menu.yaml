# Collection sort control: the pill (testID collection-sort) opens a "Sort by" BottomSheet
# with three modes, the current one checked. Picking "Date added — newest" closes the
# sheet and the pill label changes to that mode. The pill's accessibilityLabel is
# "Sort: <mode>. Tap to change.", so match that with a regex.
appId: com.iancheung228.lingostickers
---
- runFlow: ../sign-in.yaml

- tapOn: "Collection"
- extendedWaitUntil:
    visible: "Latest stickers.*"
    timeout: 20000
- takeScreenshot: 01-collection-default-sort

# Open the sort sheet from the pill.
- tapOn:
    id: "collection-sort"
- extendedWaitUntil:
    visible: "Sort by"
    timeout: 10000
- assertVisible:
    id: "collection-sort-newest"
- assertVisible:
    id: "collection-sort-oldest"
- assertVisible:
    id: "collection-sort-recentlyAdded"
- assertVisible: "Photo date — oldest"
- assertVisible: "Date added — newest"
- takeScreenshot: 02-sort-sheet-open

# Pick the third mode: sheet closes, pill shows the new label.
- tapOn:
    id: "collection-sort-recentlyAdded"
- extendedWaitUntil:
    notVisible: "Sort by"
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 1000
- assertNotVisible: "Sort by"
- assertNotVisible:
    id: "collection-sort-oldest"
- assertVisible:
    id: "collection-sort"
- assertVisible: ".*Date added — newest.*"
- takeScreenshot: 03-sort-date-added
