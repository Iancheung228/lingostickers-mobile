# The extractor's X stops a scan that is still running: no alert, the photo and
# selection stay, and Make sticker can be tapped again. Spends at most ONE
# create-sticker call (the stopped one) — check scripts/qa-budget.mjs first.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml
- tapOn:
    text: "Close this card"
    optional: true
- tapOn: "Scan a new sticker"
- tapOn:
    text: "Agree and start scanning"
    optional: true
- extendedWaitUntil:
    visible: "Import a photo from your library"
    timeout: 15000
- tapOn: "Import a photo from your library"
- waitForAnimationToEnd:
    timeout: 3000
# Any photo: the first cell of the picker grid.
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible: "Make sticker"
    timeout: 20000
- tapOn:
    point: "50%,91%"
# Stop while the scan is still running. A backend that fails instantly (staging
# without GEMINI_API_KEY) never shows the progress card; the inline error card
# then stands in, and the same photo-kept assertions apply.
- extendedWaitUntil:
    visible: "Cancel scan|Try again|Retake|OK"
    timeout: 20000
- takeScreenshot: 01-scanning
- runFlow:
    when:
      visible: "Cancel scan"
    commands:
      - tapOn: "Cancel scan"
- waitForAnimationToEnd:
    timeout: 2000
- assertNotVisible: ".*failed.*"
- assertNotVisible: "Couldn't find the word"
- assertNotVisible: "Add to Collection"
- assertVisible: "Close without extracting a sticker"
- takeScreenshot: 02-stopped-photo-kept
