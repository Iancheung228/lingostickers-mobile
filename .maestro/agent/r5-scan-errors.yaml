# R5: a scan on staging now SUCCEEDS (the AI backend has a key), so this flow asserts
# the success path: processing, then the result sheet with "Add to Collection".
# NOTE: the inline error card (kept photo, Try again/Retake, no Alert) cannot be
# reached from here any more. Error states need a FORCED FAILURE (e.g. a staging
# build with the key removed, or the network off), which this flow does not do.
# Spends ONE create-sticker call (check scripts/qa-budget.mjs first).
# Screenshots: pick object, processing, result sheet.
appId: ${APP_ID}   # set by .maestro/run.sh: the installed dev build
---
- runFlow: ../sign-in.yaml
- tapOn: "Scan a new sticker"
- tapOn:
    text: "Agree and start scanning"
    optional: true
- extendedWaitUntil:
    visible: "Import a photo from your library"
    timeout: 15000
- tapOn: "Import a photo from your library"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "PXGGridLayout-Info"
    index: 0
- extendedWaitUntil:
    visible: "Make sticker"
    timeout: 20000
- takeScreenshot: r5-pick-object
- tapOn: "Make sticker"
- extendedWaitUntil:
    visible: "Cancel scan"
    timeout: 10000
- takeScreenshot: r5-processing
- extendedWaitUntil:
    visible: "Add to Collection|Add .* cards"
    timeout: 90000
- assertNotVisible: "Couldn't find the word"
- assertNotVisible: "Try again"
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: r5-scan-result
