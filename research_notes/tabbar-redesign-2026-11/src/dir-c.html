*{box-sizing:border-box;margin:0}
body{background:#2b2224;font-family:Newsreader;color:#ddd}
.row{display:flex;gap:28px;padding:28px;width:max-content}
.ph{display:flex;flex-direction:column;align-items:center;gap:10px}
.ph figcaption{font:500 15px Newsreader;color:#e8d9d9}
.scr{position:relative;width:393px;height:852px;overflow:hidden;border-radius:44px;background:#FAF4EA;box-shadow:0 0 0 8px #111,0 20px 50px rgba(0,0,0,.5)}
.t{font:500 22px Newsreader;color:#e8d9d9;padding:24px 28px 0}
.strip{display:flex;gap:0;width:max-content}

    .bar{position:absolute;left:0;right:0;bottom:0;height:83px;background:#E4A0A1;border-radius:24px 24px 0 0;display:flex;padding:0 6px;height:88px}
    .bar .it{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:10px;position:relative;color:#662B31}
    .bar .ic{height:26px;display:flex;align-items:center;justify-content:center;position:relative}
    .bar .lb{font:500 calc(11px*var(--dt)) /13px Newsreader;margin-top:6px}
    .bar .it:not(.on):not(.scan){color:#7A383E}
    .bar .it.on::before{content:"";position:absolute;top:5px;left:50%;margin-left:-9px;width:18px;height:3px;border-radius:2px;background:#FAF4EA}
    .bar .it{padding-top:14px!important}.bar .it.scan{padding-top:14px!important}
    .bar .disc{width:36px;height:36px;margin:-5px 0;border-radius:50%;background:#FAF4EA;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(102,43,49,.18)}
    
    .bar .it.scan.on .disc{background:#fff;box-shadow:0 0 0 3px rgba(250,244,234,.55)}
    .bar .badge{position:absolute;left:calc(50% + 8px);top:-4px;min-width:17px;height:17px;border-radius:9px;background:#662B31;color:#FAF4EA;font:700 10.5px/17px 'JetBrains Mono';text-align:center;padding:0 4px;box-shadow:0 0 0 2px #E4A0A1}
