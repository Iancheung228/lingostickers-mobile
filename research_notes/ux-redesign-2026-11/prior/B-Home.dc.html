<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B Rose, refined — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#833F46}a:hover{color:#662B31}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #FAF4EA; font-family: Newsreader, Georgia, serif; color: #4A4340">

  <div style="background: #E4A0A1; border-radius: 0 0 28px 28px; padding: 50px 20px 22px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 1.4px; color: #662B31">THU 12 NOV</div>
      <div style="display: flex; margin-right: -10px">
        <button aria-label="Search" style="width: 44px; height: 44px; border: 0; background: transparent; color: #662B31; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
        <button aria-label="Settings" style="width: 44px; height: 44px; border: 0; background: transparent; color: #662B31; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 32px; line-height: 38px; font-weight: 500; letter-spacing: -0.3px; color: #662B31">12 cards are waiting</h1>
      <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.6px; color: #662B31">ABOUT 4 MIN · FRENCH</div>
    </div>
    <button style="margin-top: 4px; height: 52px; border: 0; border-radius: 26px; background: #9D4D51; color: #FFFFFF; font-family: inherit; font-size: 18px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
      Start review
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>

  <div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="height: 52px; border: 1px solid #EADFD6; border-radius: 16px; background: #FFFFFF; color: #833F46; font-family: inherit; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Scan
      </button>
      <button style="height: 52px; border: 1px solid #EADFD6; border-radius: 16px; background: #FFFFFF; color: #833F46; font-family: inherit; font-size: 17px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
        Type a word
      </button>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #EADFD6; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 1.2px; color: #8A6266">FOUND TODAY</div>
        <div style="font-size: 20px; font-weight: 500; color: #833F46">2 <span style="color: #8A6266; font-size: 16px">of 5</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">
        <sc-for list="{{week}}" as="day" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
            <sc-if value="{{day.done}}" hint-placeholder-val="{{true}}">
              <div style="width: 12px; height: 12px; border-radius: 6px; background: #9D4D51"></div>
            </sc-if>
            <sc-if value="{{day.today}}" hint-placeholder-val="{{false}}">
              <div style="width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; border: 2px solid #9D4D51"></div>
            </sc-if>
            <sc-if value="{{day.future}}" hint-placeholder-val="{{false}}">
              <div style="width: 12px; height: 12px; border-radius: 6px; background: #EADFD6"></div>
            </sc-if>
            <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; color: #8A6266">{{day.label}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
        <h2 style="margin: 0; font-size: 22px; font-weight: 500; color: #833F46">Recent</h2>
        <a href="#" style="font-size: 16px">See all</a>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #EADFD6; border-radius: 20px; padding: 4px 16px">
        <sc-for list="{{recent}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 14px; height: 64px; border-bottom: {{s.rule}}">
            <div style="width: 48px; height: 48px; border-radius: 12px; background: #F6EEDD; display: flex; align-items: center; justify-content: center; flex: 0 0 48px"><img src="{{s.src}}" alt="{{s.word}}" style="width: 38px; height: 38px"></div>
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <div style="font-size: 20px; font-weight: 500; color: #833F46; line-height: 24px">{{s.word}}</div>
              <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; color: #8A6266">{{s.reading}} · {{s.meaning}}</div>
            </div>
            <div style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; color: #8A6266">{{s.when}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <nav style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: 280px; height: 64px; border-radius: 32px; background: #E4A0A1; display: flex; align-items: center; justify-content: space-around; padding: 0 10px; box-sizing: border-box; box-shadow: 0 8px 24px rgba(102,43,49,0.18)">
    <a href="#" aria-label="Collection" aria-current="page" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; color: #9D4D51; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    </a>
    <a href="#" aria-label="Calendar" style="width: 48px; height: 48px; border-radius: 24px; color: #662B31; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </a>
    <a href="#" aria-label="Scan" style="width: 52px; height: 52px; border-radius: 26px; background: #9D4D51; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
    </a>
    <a href="#" aria-label="Boards" style="width: 48px; height: 48px; border-radius: 24px; color: #662B31; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const B = '/_blob/';
const week = ['M','T','W','T','F','S','S'].map((label, i) => ({
  label: label, done: i < 3, today: i === 3, future: i > 3
}));
const recent = [
  { word: 'la tasse', reading: '[tas]', meaning: 'cup', when: '2H', src: B + '5bfe8029355e56923f0ffb31b427ab0f' },
  { word: 'la plante', reading: '[plɑ̃t]', meaning: 'plant', when: '2H', src: B + '5db970f9a7265d73344073359e6bc718' },
  { word: 'le citron', reading: '[sitʁɔ̃]', meaning: 'lemon', when: 'YDAY', src: B + 'df02abdfe3e6f4fb5636da7f77286bcf' }
];
return {
  week: week,
  recent: recent.map((r, i) => Object.assign({}, r, { rule: i < recent.length - 1 ? '1px solid #F4EBE2' : '0' }))
};
}
}
</script>
</body>
</html>
