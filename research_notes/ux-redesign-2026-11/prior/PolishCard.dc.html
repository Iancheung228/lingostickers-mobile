<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polished study card — palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: {{v.pageBg}}; color: {{p.body}}; font-family: Figtree, system-ui, sans-serif">

  <div style="padding: 52px 16px 0 16px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Close review" style="width: 44px; height: 44px; border-radius: 22px; border: {{v.cardBorder}}; background: {{p.card}}; box-shadow: {{v.smallShadow}}; color: {{p.head}}; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 44px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: {{p.cap}}"><span>3 of 12</span><span>~3 min left</span></div>
      <div style="height: 6px; border-radius: 3px; background: {{p.track}}; box-shadow: {{v.wellShadow}}"><div style="width: 25%; height: 6px; border-radius: 3px; background: {{v.btnBg}}"></div></div>
    </div>
    <button aria-label="More: share, save image, delete" style="width: 44px; height: 44px; border-radius: 22px; border: {{v.cardBorder}}; background: {{p.card}}; box-shadow: {{v.smallShadow}}; color: {{p.head}}; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 44px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </div>

  <div style="margin: 18px 16px 0 16px; background: {{p.card}}; border: {{v.cardBorder}}; box-shadow: {{v.cardShadow}}; border-radius: 28px; padding: 22px 22px 24px 22px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; gap: 6px">
        <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: {{p.tint}}; color: {{p.head}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">French</span>
        <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: {{p.tint}}; color: {{p.head}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">noun</span>
      </div>
      <div style="font-size: 13px; font-weight: 600; color: {{p.cap}}">1st review</div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: Newsreader, Georgia, serif; font-size: 58px; line-height: 60px; font-weight: 500; letter-spacing: -1px; color: {{p.head}}">pomme</div>
        <div style="font-family: Newsreader, Georgia, serif; font-size: 20px; color: {{p.cap}}">[pɔm]</div>
      </div>
      <div style="width: 100px; height: 100px; border-radius: 24px; background: {{p.sand}}; box-shadow: {{v.wellShadow}}; display: flex; align-items: center; justify-content: center; flex: 0 0 100px"><img src="/_blob/d114c7ae26e80153fde6ca7881e95495" alt="Sticker: an apple" style="width: 86px; height: 86px; transform: rotate(-6deg); filter: {{v.stickerFx}}"></div>
    </div>

    <div style="display: flex; gap: 10px">
      <button style="flex: 1 1 auto; height: 46px; border: 0; border-radius: 23px; background: {{v.btnBg}}; box-shadow: {{v.btnShadow}}; color: {{p.actionInk}}; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        Listen
      </button>
      <button style="flex: 1 1 auto; height: 46px; border: 0; border-radius: 23px; background: {{p.tint}}; color: {{p.head}}; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        Hold to record
      </button>
    </div>

    <div style="height: 1px; background: {{p.track}}"></div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600; color: {{p.cap}}">Means</div>
      <div style="font-family: Newsreader, Georgia, serif; font-size: 28px; line-height: 32px; font-weight: 500; color: {{p.body}}">apple</div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 600; color: {{p.cap}}">In use</div>
      <div style="font-family: Newsreader, Georgia, serif; font-size: 21px; line-height: 28px; color: {{p.body}}">Je mange une <span style="color: {{p.head}}; font-weight: 600; background: {{v.marker}}; padding: 0 2px">pomme</span> rouge.</div>
      <div style="font-size: 16px; line-height: 22px; color: {{p.cap}}">I am eating a red apple.</div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{grades}}" as="g" hint-placeholder-count="4">
      <button style="height: 64px; border: 0; border-radius: 20px; background: {{g.bg}}; box-shadow: {{g.shadow}}; color: {{g.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 16px; font-weight: 700">{{g.label}}</span><span style="font-size: 12px; font-weight: 600; opacity: 0.9">{{g.when}}</span></button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","default":"rose","options":["rose","blush","sky","powder","midnight"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const PAL = {
  rose: { page: '#FAF4EA', pageTop: '#F5E3DD', card: '#FFFFFF', sand: '#F6EEDD', tint: '#F7E3E3', track: '#EFE2DA',
    head: '#833F46', body: '#4A4340', cap: '#8A6266',
    action: '#9D4D51', actionTop: '#B5646A', actionInk: '#FFFFFF', actionShadow: '157,77,81', shadow: '131,63,70', dark: false },
  blush: { page: '#FFF8F6', pageTop: '#FCE7E9', card: '#FFFFFF', sand: '#FCEFEF', tint: '#FCE4E8', track: '#F6E3E6',
    head: '#8C3A4B', body: '#4B3F43', cap: '#8E6470',
    action: '#B44A60', actionTop: '#CC6379', actionInk: '#FFFFFF', actionShadow: '180,74,96', shadow: '160,70,90', dark: false },
  sky: { page: '#F6F9FE', pageTop: '#E1EDFD', card: '#FFFFFF', sand: '#EAF2FD', tint: '#E3EEFD', track: '#DCE6F5',
    head: '#1F3A6B', body: '#2E3A4E', cap: '#5B6B85',
    action: '#2F66D0', actionTop: '#4C82EA', actionInk: '#FFFFFF', actionShadow: '47,102,208', shadow: '40,80,160', dark: false },
  powder: { page: '#F8FBFF', pageTop: '#E4F0FB', card: '#FFFFFF', sand: '#EEF5FC', tint: '#FFE9DD', track: '#DCE6F5',
    head: '#24406B', body: '#2E3A4E', cap: '#5B6B85',
    action: '#F2A27A', actionTop: '#F8BC98', actionInk: '#24406B', actionShadow: '230,140,100', shadow: '36,64,107', dark: false },
  midnight: { page: '#0F1626', pageTop: '#18264A', card: '#1A2438', sand: '#22304A', tint: '#22304A', track: '#26344F',
    head: '#CFE0FF', body: '#E3E9F4', cap: '#9AA9C4',
    action: '#8DB4FF', actionTop: '#AECBFF', actionInk: '#0F1A33', actionShadow: '141,180,255', shadow: '0,0,0', dark: true }
};
const p = PAL[this.props.palette ?? 'rose'] || PAL.rose;
const s = p.shadow;
const light = !p.dark;
const v = {
  pageBg: 'linear-gradient(180deg, ' + p.pageTop + ' 0px, ' + p.page + ' 460px)',
  cardShadow: light
    ? 'inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 1px rgba(' + s + ',0.05), 0 8px 18px rgba(' + s + ',0.07), 0 24px 48px rgba(' + s + ',0.10)'
    : 'inset 0 1px 0 rgba(255,255,255,0.06), 0 18px 40px rgba(0,0,0,0.5)',
  smallShadow: light ? '0 1px 1px rgba(' + s + ',0.05), 0 4px 12px rgba(' + s + ',0.10)' : '0 6px 16px rgba(0,0,0,0.4)',
  cardBorder: light ? '1px solid rgba(' + s + ',0.06)' : '1px solid rgba(255,255,255,0.06)',
  wellShadow: light ? 'inset 0 1px 3px rgba(' + s + ',0.10)' : 'inset 0 1px 3px rgba(0,0,0,0.45)',
  stickerFx: 'drop-shadow(0 8px 9px rgba(' + s + ',' + (light ? '0.24' : '0.55') + ')) drop-shadow(0 1px 1px rgba(' + s + ',0.2))',
  btnBg: 'linear-gradient(180deg, ' + p.actionTop + ', ' + p.action + ')',
  btnShadow: 'inset 0 1px 0 rgba(255,255,255,0.28), 0 6px 14px rgba(' + p.actionShadow + ',0.32)',
  marker: 'linear-gradient(180deg, transparent 58%, ' + p.tint + ' 58%)'
};
const G = light ? [
  { label: 'Again', when: '1 min', a: '#BC5A61', b: '#A8434A', ink: '#FFFFFF', sh: '168,67,74' },
  { label: 'Hard', when: '6 min', a: '#F9EEDB', b: '#F1DFBF', ink: '#6E4A12', sh: '160,120,60' },
  { label: 'Good', when: '10 min', a: '#EAF4EB', b: '#D6E8D7', ink: '#2F5E35', sh: '60,120,70' },
  { label: 'Easy', when: '4 days', a: '#5E8F64', b: '#4C7A52', ink: '#FFFFFF', sh: '60,110,70' }
] : [
  { label: 'Again', when: '1 min', a: '#6B2C32', b: '#5A2328', ink: '#FFD6D8', sh: '0,0,0' },
  { label: 'Hard', when: '6 min', a: '#584628', b: '#4A3A1E', ink: '#F3DDB0', sh: '0,0,0' },
  { label: 'Good', when: '10 min', a: '#2C4E34', b: '#23402A', ink: '#CDEBD0', sh: '0,0,0' },
  { label: 'Easy', when: '4 days', a: '#A6D9AD', b: '#8FCB98', ink: '#10261A', sh: '0,0,0' }
];
return {
  p: p, v: v,
  grades: G.map(g => ({
    label: g.label, when: g.when, ink: g.ink,
    bg: 'linear-gradient(180deg, ' + g.a + ', ' + g.b + ')',
    shadow: 'inset 0 1px 0 rgba(255,255,255,' + (light ? '0.35' : '0.08') + '), 0 6px 14px rgba(' + g.sh + ',' + (light ? '0.22' : '0.45') + ')'
  }))
};
}
}
</script>
</body>
</html>
