<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Refined — study card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: {{t.page}}; color: {{t.body}}; font-family: Figtree, system-ui, sans-serif">

  <div style="padding: 52px 16px 0 16px; display: flex; align-items: center; gap: 12px">
    <button aria-label="Close review" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{t.card}}; box-shadow: {{t.shadow}}; color: {{t.head}}; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 44px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; font-weight: 600; color: {{t.cap}}">3 of 12</div>
      <div style="height: 4px; border-radius: 2px; background: {{t.track}}"><div style="width: 25%; height: 4px; border-radius: 2px; background: {{t.action}}"></div></div>
    </div>
    <button aria-label="More: share, save image, delete" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: {{t.card}}; box-shadow: {{t.shadow}}; color: {{t.head}}; display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 44px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </div>

  <sc-if value="{{isFront}}" hint-placeholder-val="{{false}}">
    <div style="margin: 18px 16px 0 16px; background: {{t.card}}; box-shadow: {{t.shadow}}; border-radius: 28px; padding: 16px 16px 26px 16px; display: flex; flex-direction: column; gap: 22px">
      <div style="height: 300px; border-radius: 20px; background: {{t.sand}}; display: flex; align-items: center; justify-content: center">
        <img src="/_blob/d114c7ae26e80153fde6ca7881e95495" alt="Sticker: an apple" style="width: 200px; height: 200px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center">
        <div style="font-size: 13px; font-weight: 600; color: {{t.cap}}">French · noun · 1st review</div>
        <div style="font-family: Newsreader, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 500; color: {{t.head}}">What is this in French?</div>
        <div style="font-size: 15px; color: {{t.cap}}">Say it out loud, then check.</div>
      </div>
    </div>
    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: flex; flex-direction: column; gap: 6px">
      <button style="height: 58px; border: 0; border-radius: 29px; background: {{t.action}}; color: {{t.actionInk}}; font-family: inherit; font-size: 17px; font-weight: 600">Show answer</button>
    </div>
  </sc-if>

  <sc-if value="{{isBack}}" hint-placeholder-val="{{true}}">
    <div style="margin: 18px 16px 0 16px; background: {{t.card}}; box-shadow: {{t.shadow}}; border-radius: 28px; padding: 22px 22px 24px 22px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: {{t.cap}}">
        <div>French · noun</div>
        <div>1st review</div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <div style="font-family: Newsreader, Georgia, serif; font-size: 56px; line-height: 60px; font-weight: 500; letter-spacing: -0.8px; color: {{t.head}}">pomme</div>
        <div style="width: 92px; height: 92px; border-radius: 20px; background: {{t.sand}}; display: flex; align-items: center; justify-content: center; flex: 0 0 92px"><img src="/_blob/d114c7ae26e80153fde6ca7881e95495" alt="Sticker: an apple" style="width: 76px; height: 76px"></div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between">
        <div style="font-family: Newsreader, Georgia, serif; font-size: 21px; color: {{t.body}}">[pɔm]</div>
        <div style="display: flex; gap: 10px">
          <button aria-label="Play pronunciation" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: {{t.action}}; color: {{t.actionInk}}; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
          <button aria-label="Hold to record yourself" style="width: 48px; height: 48px; border-radius: 24px; border: 0; background: {{t.sand}}; color: {{t.head}}; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
          </button>
        </div>
      </div>

      <div style="height: 1px; background: {{t.divider}}"></div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; font-weight: 600; color: {{t.cap}}">Means</div>
        <div style="font-family: Newsreader, Georgia, serif; font-size: 28px; line-height: 32px; font-weight: 500; color: {{t.body}}">apple</div>
      </div>

      <div style="height: 1px; background: {{t.divider}}"></div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <div style="font-size: 13px; font-weight: 600; color: {{t.cap}}">In use</div>
        <div style="font-family: Newsreader, Georgia, serif; font-size: 21px; line-height: 28px; color: {{t.body}}">Je mange une <span style="color: {{t.head}}; font-weight: 600">pomme</span> rouge.</div>
        <div style="font-size: 16px; line-height: 22px; color: {{t.cap}}">I am eating a red apple.</div>
      </div>
    </div>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{grades}}" as="g" hint-placeholder-count="4">
        <button style="height: 62px; border: 0; border-radius: 18px; background: {{g.bg}}; color: {{g.ink}}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 16px; font-weight: 600">{{g.label}}</span><span style="font-size: 12px; font-weight: 500">{{g.when}}</span></button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"side":{"editor":"enum","default":"back","options":["front","back"]},"theme":{"editor":"enum","default":"light","options":["light","dark"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const side = this.props.side ?? 'back';
const theme = this.props.theme ?? 'light';
const L = {
  page: '#FAF4EA', card: '#FFFFFF', shadow: '0 1px 2px rgba(102,43,49,0.06), 0 8px 24px rgba(102,43,49,0.08)',
  head: '#833F46', body: '#4A4340', cap: '#8A6266', action: '#9D4D51', actionInk: '#FFFFFF',
  sand: '#F6EEDD', divider: '#F4EBE2', track: '#EADFD6'
};
const D = {
  page: '#1C1617', card: '#2E2526', shadow: 'none',
  head: '#F0B8BA', body: '#EDE3DF', cap: '#BFA3A5', action: '#E4A0A1', actionInk: '#3A1418',
  sand: '#3A2F30', divider: '#3A2F30', track: '#3A2F30'
};
const gradesL = [
  { label: 'Again', when: '1 min', bg: '#A8434A', ink: '#FFFFFF' },
  { label: 'Hard', when: '6 min', bg: '#F3E3C6', ink: '#6E4A12' },
  { label: 'Good', when: '10 min', bg: '#DCEBDD', ink: '#2F5E35' },
  { label: 'Easy', when: '4 days', bg: '#4C7A52', ink: '#FFFFFF' }
];
const gradesD = [
  { label: 'Again', when: '1 min', bg: '#5A2328', ink: '#FFD6D8' },
  { label: 'Hard', when: '6 min', bg: '#4A3A1E', ink: '#F3DDB0' },
  { label: 'Good', when: '10 min', bg: '#23402A', ink: '#CDEBD0' },
  { label: 'Easy', when: '4 days', bg: '#8FCB98', ink: '#10261A' }
];
return {
  t: theme === 'dark' ? D : L,
  grades: theme === 'dark' ? gradesD : gradesL,
  isFront: side === 'front',
  isBack: side !== 'front'
};
}
}
</script>
</body>
</html>
