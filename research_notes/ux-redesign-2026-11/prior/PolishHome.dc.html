<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Polished Home — depth and palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: {{v.pageBg}}; color: {{p.body}}; font-family: Figtree, system-ui, sans-serif">

  <div style="position: relative; height: 290px; background: {{v.wallBg}}; overflow: hidden">
    <img src="/_blob/d114c7ae26e80153fde6ca7881e95495" alt="" style="position: absolute; left: 30px; top: 104px; width: 100px; height: 100px; transform: rotate(-9deg); filter: {{v.stickerFx}}">
    <img src="/_blob/5bfe8029355e56923f0ffb31b427ab0f" alt="" style="position: absolute; left: 148px; top: 84px; width: 94px; height: 94px; transform: rotate(5deg); filter: {{v.stickerFx}}">
    <img src="/_blob/5db970f9a7265d73344073359e6bc718" alt="" style="position: absolute; left: 262px; top: 98px; width: 100px; height: 100px; transform: rotate(-4deg); filter: {{v.stickerFx}}">
    <img src="/_blob/df02abdfe3e6f4fb5636da7f77286bcf" alt="" style="position: absolute; left: 104px; top: 172px; width: 72px; height: 72px; transform: rotate(12deg); filter: {{v.stickerFx}}">
    <img src="/_blob/0eec1d24843a7df1533a4e05796e784a" alt="" style="position: absolute; left: 214px; top: 176px; width: 74px; height: 74px; transform: rotate(-6deg); filter: {{v.stickerFx}}">

      <div style="display: flex; gap: 8px">
        <button aria-label="Search" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: {{v.chipBg}}; backdrop-filter: {{v.blur}}; -webkit-backdrop-filter: {{v.blur}}; box-shadow: {{v.chipShadow}}; color: {{p.head}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
        <button aria-label="Edit your wall" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: {{v.chipBg}}; backdrop-filter: {{v.blur}}; -webkit-backdrop-filter: {{v.blur}}; box-shadow: {{v.chipShadow}}; color: {{p.head}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      </div>
    </div>
  </div>

  <div style="position: relative; margin: -60px 16px 0 16px; background: {{p.card}}; border: {{v.cardBorder}}; box-shadow: {{v.cardShadow}}; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
    <sc-if value="{{v.hero}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; align-items: center; gap: 18px">
        <div style="position: relative; width: 86px; height: 104px; flex: 0 0 86px">
          <div style="position: absolute; left: 14px; top: 8px; width: 66px; height: 88px; border-radius: 13px; background: {{p.sand}}; transform: rotate(9deg); box-shadow: {{v.miniShadow}}"></div>
          <div style="position: absolute; left: 4px; top: 6px; width: 66px; height: 88px; border-radius: 13px; background: {{p.card}}; border: {{v.miniBorder}}; transform: rotate(-7deg); box-shadow: {{v.miniShadow}}"></div>
          <div style="position: absolute; left: 9px; top: 6px; width: 68px; height: 92px; border-radius: 14px; background: {{p.card}}; border: {{v.miniBorder}}; box-shadow: {{v.miniShadow}}; display: flex; align-items: center; justify-content: center"><img src="/_blob/f5d2ad564a2997775fc9de2ec204e6ed" alt="Next card" style="width: 54px; height: 54px; filter: {{v.stickerFx}}"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <div style="font-family: Newsreader, Georgia, serif; font-size: 34px; line-height: 36px; font-weight: 500; letter-spacing: -0.5px; color: {{p.head}}">12 cards</div>
          <div style="font-size: 15px; font-weight: 500; color: {{p.cap}}">ready for you · about 4 min</div>
          <div style="display: flex; gap: 6px; margin-top: 4px">
            <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: {{p.tint}}; color: {{p.head}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">French</span>
            <span style="height: 24px; padding: 0 10px; border-radius: 12px; background: {{p.tint}}; color: {{p.head}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">3 new</span>
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{v.noHero}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <div style="font-family: Newsreader, Georgia, serif; font-size: 27px; line-height: 32px; font-weight: 500; letter-spacing: -0.3px; color: {{p.head}}">12 cards are waiting</div>
        <div style="font-size: 14px; font-weight: 500; color: {{p.cap}}">~4 min</div>
      </div>
    </sc-if>
    <button style="height: 52px; border: 0; border-radius: 26px; background: {{v.btnBg}}; box-shadow: {{v.btnShadow}}; color: {{p.actionInk}}; font-family: inherit; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      Start review
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
  </div>

  <div style="padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button style="height: 56px; border: {{v.cardBorder}}; border-radius: 18px; background: {{v.secBg}}; box-shadow: {{v.secShadow}}; color: {{p.head}}; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
        <span style="width: {{v.chipSize}}; height: {{v.chipSize}}; border-radius: 16px; background: {{v.iconChipBg}}; color: {{v.iconColour}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
        Scan
      </button>
      <button style="height: 56px; border: {{v.cardBorder}}; border-radius: 18px; background: {{v.secBg}}; box-shadow: {{v.secShadow}}; color: {{p.head}}; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
        <span style="width: {{v.chipSize}}; height: {{v.chipSize}}; border-radius: 16px; background: {{v.iconChipBg}}; color: {{v.iconColour}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg></span>
        Type a word
      </button>
    </div>

    <div style="background: {{p.card}}; border: {{v.cardBorder}}; box-shadow: {{v.cardShadow}}; border-radius: 22px; padding: 14px 16px">
      <sc-if value="{{v.hero}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 14px">
          <svg role="img" aria-label="2 of 5 found today" width="48" height="48" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="19" fill="none" stroke="{{p.track}}" stroke-width="6"/>
            <circle cx="24" cy="24" r="19" fill="none" stroke="{{p.action}}" stroke-width="6" stroke-linecap="round" stroke-dasharray="47.8 119.4" transform="rotate(-90 24 24)"/>
          </svg>
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px">
            <div style="font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 500; color: {{p.head}}">2 of 5 found today</div>
            <div style="font-size: 13px; font-weight: 500; color: {{p.cap}}">3 more to reach your goal</div>
          </div>
          <div style="display: flex; gap: 4px">
            <sc-for list="{{week}}" as="day" hint-placeholder-count="7">
              <div style="width: 7px; height: 22px; border-radius: 4px; background: {{day.fill}}"></div>
            </sc-for>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{v.noHero}}" hint-placeholder-val="{{false}}">
        <div style="display: flex; justify-content: space-between; align-items: baseline">
          <div style="font-size: 15px; font-weight: 600; color: {{p.body}}">Found today</div>
          <div style="font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 500; color: {{p.head}}">2 <span style="color: {{p.cap}}; font-size: 16px">of 5</span></div>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
        <h2 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 22px; font-weight: 500; color: {{p.head}}">Recent</h2>
        <a href="#" style="font-size: 15px; font-weight: 600; color: {{p.link}}; text-decoration: none">See all</a>
      </div>
      <div style="background: {{p.card}}; border: {{v.cardBorder}}; box-shadow: {{v.cardShadow}}; border-radius: 22px; padding: 4px 14px">
        <sc-for list="{{recent}}" as="s" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 14px; height: 64px; border-bottom: {{s.rule}}">
            <div style="width: 48px; height: 48px; border-radius: 14px; background: {{p.sand}}; box-shadow: {{v.wellShadow}}; display: flex; align-items: center; justify-content: center; flex: 0 0 48px"><img src="{{s.src}}" alt="{{s.word}}" style="width: 40px; height: 40px; transform: rotate({{s.tilt}}); filter: {{v.stickerFx}}"></div>
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <div style="font-family: Newsreader, Georgia, serif; font-size: 20px; font-weight: 500; color: {{p.head}}; line-height: 24px">{{s.word}}</div>
              <div style="font-size: 14px; color: {{p.cap}}">{{s.meaning}}</div>
            </div>
            <div style="font-size: 13px; color: {{p.cap}}">{{s.when}}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 8px 10px 0 10px; background: {{v.tabBg}}; backdrop-filter: {{v.blurStrong}}; -webkit-backdrop-filter: {{v.blurStrong}}; border-top: {{v.tabBorder}}; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: start">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{p.link}}; text-decoration: none; font-size: 11px; font-weight: 700">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: {{v.activePill}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>Today</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{p.cap}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Calendar</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{p.cap}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <span style="width: 44px; height: 32px; border-radius: 16px; background: {{v.btnBg}}; box-shadow: {{v.scanShadow}}; color: {{p.actionInk}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>Scan</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; color: {{p.cap}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <span style="width: 56px; height: 32px; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg></span>Boards</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"depth":{"editor":"enum","default":"4","options":["0","1","2","3","4"]},"palette":{"editor":"enum","default":"rose","options":["rose","blush","sky","powder","midnight"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const PAL = {
  rose: { page: '#FAF4EA', pageTop: '#F5E3DD', card: '#FFFFFF', sand: '#F6EEDD', tint: '#F7E3E3', track: '#EFE2DA',
    head: '#833F46', body: '#4A4340', cap: '#8A6266', link: '#9D4D51',
    action: '#9D4D51', actionTop: '#B5646A', actionInk: '#FFFFFF', actionShadow: '157,77,81',
    shadow: '131,63,70', wall: '#F1DCD3', wallDot: 'rgba(131,63,70,0.10)', dark: false },
  blush: { page: '#FFF8F6', pageTop: '#FCE7E9', card: '#FFFFFF', sand: '#FCEFEF', tint: '#FCE4E8', track: '#F6E3E6',
    head: '#8C3A4B', body: '#4B3F43', cap: '#8E6470', link: '#B44A60',
    action: '#B44A60', actionTop: '#CC6379', actionInk: '#FFFFFF', actionShadow: '180,74,96',
    shadow: '160,70,90', wall: '#FBE0E4', wallDot: 'rgba(180,74,96,0.10)', dark: false },
  sky: { page: '#F6F9FE', pageTop: '#E1EDFD', card: '#FFFFFF', sand: '#EAF2FD', tint: '#E3EEFD', track: '#DCE6F5',
    head: '#1F3A6B', body: '#2E3A4E', cap: '#5B6B85', link: '#2F66D0',
    action: '#2F66D0', actionTop: '#4C82EA', actionInk: '#FFFFFF', actionShadow: '47,102,208',
    shadow: '40,80,160', wall: '#DCEAFC', wallDot: 'rgba(47,102,208,0.12)', dark: false },
  powder: { page: '#F8FBFF', pageTop: '#E4F0FB', card: '#FFFFFF', sand: '#EEF5FC', tint: '#FFE9DD', track: '#DCE6F5',
    head: '#24406B', body: '#2E3A4E', cap: '#5B6B85', link: '#24406B',
    action: '#F2A27A', actionTop: '#F8BC98', actionInk: '#24406B', actionShadow: '230,140,100',
    shadow: '36,64,107', wall: '#DCEAF8', wallDot: 'rgba(36,64,107,0.10)', dark: false },
  midnight: { page: '#0F1626', pageTop: '#18264A', card: '#1A2438', sand: '#22304A', tint: '#22304A', track: '#26344F',
    head: '#CFE0FF', body: '#E3E9F4', cap: '#9AA9C4', link: '#A7C5FF',
    action: '#8DB4FF', actionTop: '#AECBFF', actionInk: '#0F1A33', actionShadow: '141,180,255',
    shadow: '0,0,0', wall: '#16223C', wallDot: 'rgba(141,180,255,0.14)', dark: true }
};
const p = PAL[this.props.palette ?? 'rose'] || PAL.rose;
const d = Number(this.props.depth ?? 4);
const s = p.shadow;
const light = !p.dark;
const layered = light
  ? 'inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 1px rgba(' + s + ',0.05), 0 6px 14px rgba(' + s + ',0.06), 0 18px 36px rgba(' + s + ',0.09)'
  : 'inset 0 1px 0 rgba(255,255,255,0.06), 0 14px 32px rgba(0,0,0,0.45)';
const v = {
  pageBg: d >= 2 ? 'linear-gradient(180deg, ' + p.pageTop + ' 0px, ' + p.page + ' 520px)' : p.page,
  wallBg: d >= 3 ? 'radial-gradient(' + p.wallDot + ' 1.2px, transparent 1.7px) 0 0 / 16px 16px, ' + p.wall : p.wall,
  wallFade: d >= 2 ? 'linear-gradient(180deg, rgba(0,0,0,0), ' + p.pageTop + ')' : 'none',
  stickerFx: d >= 1 ? 'drop-shadow(0 8px 9px rgba(' + s + ',' + (light ? '0.22' : '0.5') + ')) drop-shadow(0 1px 1px rgba(' + s + ',0.2))' : 'none',
  cardShadow: d >= 2 ? layered : 'none',
  cardBorder: d >= 2 ? (light ? '1px solid rgba(' + s + ',0.06)' : '1px solid rgba(255,255,255,0.06)') : '1px solid ' + p.track,
  miniShadow: d >= 2 ? (light ? '0 4px 10px rgba(' + s + ',0.14)' : '0 6px 14px rgba(0,0,0,0.4)') : 'none',
  miniBorder: '1px solid ' + (light ? 'rgba(' + s + ',0.08)' : 'rgba(255,255,255,0.08)'),
  btnBg: d >= 2 ? 'linear-gradient(180deg, ' + p.actionTop + ', ' + p.action + ')' : p.action,
  btnShadow: d >= 2 ? 'inset 0 1px 0 rgba(255,255,255,0.28), 0 8px 18px rgba(' + p.actionShadow + ',0.35)' : 'none',
  scanShadow: d >= 2 ? '0 4px 10px rgba(' + p.actionShadow + ',0.35)' : 'none',
  secBg: d >= 2 ? p.card : p.sand,
  secShadow: d >= 2 ? layered : 'none',
  wellShadow: d >= 2 ? (light ? 'inset 0 1px 3px rgba(' + s + ',0.08)' : 'inset 0 1px 3px rgba(0,0,0,0.4)') : 'none',
  chipSize: d >= 4 ? '32px' : '20px',
  iconChipBg: d >= 4 ? p.tint : 'transparent',
  iconColour: d >= 4 ? p.link : p.head,
  chipBg: d >= 4 ? (light ? 'rgba(255,255,255,0.62)' : 'rgba(15,22,38,0.55)') : (light ? 'rgba(255,255,255,0.88)' : 'rgba(15,22,38,0.85)'),
  chipShadow: d >= 2 ? (light ? '0 2px 8px rgba(' + s + ',0.10)' : 'none') : 'none',
  blur: d >= 4 ? 'blur(14px) saturate(160%)' : 'none',
  blurStrong: d >= 4 ? 'blur(22px) saturate(170%)' : 'none',
  tabBg: d >= 4 ? (light ? 'rgba(255,255,255,0.72)' : 'rgba(15,22,38,0.72)') : p.card,
  tabBorder: '1px solid ' + (light ? 'rgba(' + s + ',0.10)' : 'rgba(255,255,255,0.08)'),
  activePill: d >= 4 ? p.tint : 'transparent',
  hero: d >= 3,
  noHero: d < 3
};
const B = '/_blob/';
const recent = [
  { word: 'la tasse', meaning: 'cup', when: '2h', t: '-5deg', src: B + '5bfe8029355e56923f0ffb31b427ab0f' },
  { word: 'la plante', meaning: 'plant', when: '2h', t: '4deg', src: B + '5db970f9a7265d73344073359e6bc718' },
  { word: 'le citron', meaning: 'lemon', when: 'Yesterday', t: '-3deg', src: B + 'df02abdfe3e6f4fb5636da7f77286bcf' }
];
const week = [1, 1, 1, 0.5, 0, 0, 0].map(x => ({ fill: x === 1 ? p.action : (x === 0.5 ? p.actionTop : p.track) }));
return {
  p: p, v: v, week: week,
  recent: recent.map((r, i) => ({
    word: r.word, meaning: r.meaning, when: r.when, src: r.src,
    tilt: d >= 3 ? r.t : '0deg',
    rule: i < recent.length - 1 ? '1px solid ' + p.track : '0'
  }))
};
}
}
</script>
</body>
</html>
